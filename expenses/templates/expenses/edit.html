{% extends "expenses/base.html" %}
{% block title %}Edit expense{% endblock %}
{% block content %}
  <h1>Expense Tracker</h1>
  <section>
    <h2>Edit expense</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="grid">
        {% for f in form %}
          <div class="field{% if f.name == 'note' %} wide{% endif %}">{{ f.label_tag }}{{ f }}{{ f.errors }}</div>
        {% endfor %}
      </div>
      <button type="submit">Save changes</button>
      <a class="btn" href="{% url 'expense_list' %}">Cancel</a>
    </form>
  </section>
{% endblock %}
