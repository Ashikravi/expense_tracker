<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Expense Tracker{% endblock %}</title>
<style>
  :root { --ink:#1d2433; --muted:#667085; --line:#e3e6ec; --bg:#f6f7f9; --accent:#1f6f5c; --err:#b42318; }
  * { box-sizing:border-box; }
  body { font:15px/1.5 system-ui,sans-serif; color:var(--ink); background:var(--bg); margin:0; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:20px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 20px; }
  h1 { margin:0; font-size:22px; } h2 { margin:0 0 12px; font-size:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; align-items:end; margin-bottom:12px; }
  .field { display:grid; gap:4px; } .wide { grid-column:1 / -1; }
  label { font-size:13px; color:var(--muted); }
  input, select, textarea, button, .btn { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  .btn { color:var(--ink); text-decoration:none; background:#fff; display:inline-block; }
  .errorlist { color:var(--err); list-style:none; padding:0; margin:0; font-size:13px; }
  .total { font-size:28px; font-weight:600; }
  .bar { height:8px; background:var(--accent); border-radius:4px; min-width:2px; }
  .cat-row { display:grid; grid-template-columns:130px 1fr 110px; gap:10px; align-items:center; margin-top:6px; }
  .cat-row span:last-child, td.amt, th.amt { text-align:right; font-variant-numeric:tabular-nums; }
  .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:500; }
  .empty, .muted { color:var(--muted); } .empty { padding:12px 0; }
  .actions { white-space:nowrap; } .actions a { margin-right:10px; color:var(--accent); } .actions a.danger { color:var(--err); }
  button.danger { background:var(--err); border-color:var(--err); }
</style>
</head>
<body>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
